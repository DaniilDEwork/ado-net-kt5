$kind: http-request
url: "{{baseUrl}}/api/products/{{productId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"price\":  1800,\r

    \    \"categoryId\":  {{categoryId}},\r

    \    \"description\":  \"Описание после изменения\",\r

    \    \"name\":  \"Обновлённый товар\"\r

    }"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Статус ответа", () => pm.response.to.have.status(200));
      pm.test("Товар изменён", () => {
          const product = pm.response.json();
          pm.expect(product.name).to.eql("Обновлённый товар");
          pm.expect(product.price).to.eql(1800);
          pm.expect(product.description).to.eql("Описание после изменения");
      });
    language: text/javascript
order: 8000
